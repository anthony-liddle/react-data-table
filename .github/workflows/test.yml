name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The repo uses no em dashes (U+2014), comments included. reports/a11y/
      # holds captured tool output and is exempt. Each hit is annotated with
      # its file and line.
      - name: No em dashes
        run: |
          matches="$(git grep -n -I -e $'\u2014' -- . ':!reports/a11y' || true)"
          if [ -n "$matches" ]; then
            while IFS=: read -r file line _; do
              echo "::error file=${file},line=${line}::Em dash (U+2014). Use a comma, colon, period, or two sentences."
            done <<< "$matches"
            echo "$matches"
            exit 1
          fi
          echo "No em dashes in tracked files."

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lint the package (publint + attw)
        run: pnpm lint:package

      - name: Smoke test the packed tarball
        run: pnpm smoke

  # Its own job so a typecheck or unit failure in `test` can never hide a
  # broken Storybook build, and vice versa.
  storybook:
    name: storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

  # Renders every story in headless Chromium, runs its play function, and
  # fails on any axe violation. Catches stories that build but break at
  # render time, which `storybook build` alone does not.
  storybook-test:
    name: storybook tests
    runs-on: ubuntu-latest
    # The Chromium install (apt via --with-deps) has hung once; fail fast.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run story tests
        run: pnpm test:storybook
